<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language to Speech Translator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
.container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center; /* توسيط رأسي */
    align-items: center;     /* توسيط أفقي */
    padding: 0;
}

        .header-section {
    background: linear-gradient(135deg, #05070c, #1e3a8a);
    border-radius: 1rem;
    padding: 0.5rem 1rem; 
    margin: 0.5rem 0;
    margin-top: 0 !important;
    box-shadow: 0 5px 15px rgba(30, 58, 138, 0.15);
    width: 100%;
    text-align: center;
}

.header-section h1 {
    font-size: 1.5rem; 
    margin: 0.25rem 0;
    color: white;
}

.header-section p {
    font-size: 0.875rem; 
    margin: 0;
    color: #e0e7ff;
}



        .horizontal-layout {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            flex: 1;
            padding: 0 1rem;
        }

        @media (min-width: 1024px) {
            .horizontal-layout {
                flex-direction: row;
            }

            .section {
                min-height: auto;
            }
        }

        .section {
            flex: 1;
            padding: 1rem;
            border-radius: 1.5rem;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .image-section {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        .sound-section {
            background: linear-gradient(135deg, #ffffff, #c0d8ff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 6px solid #2563eb;
        }
.camera-container {
    position: relative;
    width: 500px;
    height: 500px;
    background: linear-gradient(145deg, #c9d9ff, #e6f0ff);
    border-radius: 1rem;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(41, 82, 185, 0.15);
    border: 4px solid #0d3b85;
    margin: auto; /* توسيط أفقي */
}


        #video, #snapshot-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.8rem;
        }

        #snapshot-canvas {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
        }

      

        .sound-ripple:nth-child(1) { animation-delay: 0s; }
        .sound-ripple:nth-child(2) { animation-delay: 0.8s; }
        .sound-ripple:nth-child(3) { animation-delay: 1.6s; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            opacity: 0.9;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header-section">
            <h1 class="text-4xl font-bold text-white">Sign Language Translator</h1>
            <p class="text-blue-100 text-lg">Capturing sign language gestures</p>
        </header>

        <!-- Main Content -->
        <div class="horizontal-layout">
            <!-- Left: Camera -->
            <div class="section image-section">
                <div class="camera-container">
                    <img src="{{ url_for('video_feed') }}" id="video">
                    <canvas id="snapshot-canvas"></canvas>  
                </div>
            </div>

        <!-- Footer 
        <footer class="footer">
            <p class="text-sm">Sign Language Translator © 2025 | Powered by AI Recognition</p>
        </footer>
    </div>-->
    <script src="/static/front.js"></script>
</body>
</html>
